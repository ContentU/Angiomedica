# Netlify rileva Next.js e usa il suo adapter automaticamente
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Dichiarato esplicitamente: il primo deploy (repo vuoto) non ha agganciato l'adapter in automatico
[[plugins]]
  package = "@netlify/plugin-nextjs"
